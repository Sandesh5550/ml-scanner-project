# ==============================================================================
# PRAMAAN — Production Docker Compose Override
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Production Security Invariants:
#   1. Zero host port exposure for backend, postgres, redis, prometheus,
#      alertmanager, and grafana.
#   2. Gateway (NGINX) is the sole public application ingress point.
#   3. Internal service-to-service communication occurs strictly within 'pramaan-net'.
#   4. Anonymous viewer authentication is strictly disabled on Grafana.
#   5. Backend environment enforces ENVIRONMENT=production.
#   6. Persistent data volumes are preserved identically.
# ==============================================================================

services:
  gateway:
    ports:
      - "${GATEWAY_PORT:-80}:80"
    restart: always

  mobile-web:
    restart: always

  backend:
    ports: !reset []
    environment:
      - ENVIRONMENT=production
    restart: always

  postgres:
    ports: !reset []
    restart: always

  redis:
    ports: !reset []
    restart: always

  prometheus:
    ports: !reset []
    restart: always

  alertmanager:
    ports: !reset []
    restart: always

  grafana:
    ports: !reset []
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    restart: always
