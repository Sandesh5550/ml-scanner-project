name: CI

'on':
  push:
    branches:
      - main
      - sandesh-dev
      - sandesh-latest
  pull_request:
    branches:
      - main
      - sandesh-dev
      - sandesh-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (FastAPI / Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_foodscanner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_foodscanner_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: foodscanner-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract OCR & Pyzbar)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libzbar0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: foodscanner-ai/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Backend Pytest Suite
        env:
          SECRET_KEY: "ci-testing-secret-key-foodscanner-ai-pramaan"
          FOODSCANNER_OCR_ENGINE: "tesseract"
          TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_foodscanner_db"
          TEST_POSTGRES_URL: "postgresql://test_user:test_password@localhost:5432/test_foodscanner_db"
        run: |
          pytest tests/ -v

  mobile-tests:
    name: Mobile Tests (React Native / Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: foodscanner-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: foodscanner-mobile/package-lock.json

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Run Mobile Unit Tests
        run: |
          npm test

  docker-validation:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q

      - name: Build Backend Docker Image
        run: |
          docker build -t foodscanner-ai:ci ./foodscanner-ai
